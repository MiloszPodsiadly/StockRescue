spring:
  application:
    name: stockrescue-backend
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      schema: stockrescue
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    default-schema: public
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
    consumer:
      group-id: stockrescue-inventory-change-projection-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual
    admin:
      properties:
        request.timeout.ms: 2000
        default.api.timeout.ms: 3000
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never
      table-name: stockrescue.spring_session
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      base-path: /api
      discovery:
        enabled: false
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        integration:
          include: kafka,intelligence,inventoryMessaging

stockrescue:
  inventory:
    messaging:
      topic: ${INVENTORY_EVENTS_TOPIC:stockrescue.inventory.events.v1}
      consumer-name: inventory-change-projection-v1
    outbox-relay:
      enabled: ${INVENTORY_OUTBOX_RELAY_ENABLED:true}
      fixed-delay: ${INVENTORY_OUTBOX_RELAY_DELAY:1000}
      claim-size: ${INVENTORY_OUTBOX_CLAIM_SIZE:5}
      lease-duration: ${INVENTORY_OUTBOX_LEASE_DURATION:30s}
      retry-base: 1s
      retry-maximum: 5m
  security:
    secure-cookie: true
    maximum-session-age-seconds: 43200
  intelligence:
    base-url: ${INTELLIGENCE_BASE_URL}
logging:
  structured:
    format:
      console: logstash

springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/v1/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
