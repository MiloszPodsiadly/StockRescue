spring:
  application:
    name: stockrescue-backend
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      schema: stockrescue
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 5
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    default-schema: public
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      properties:
        request.timeout.ms: 2000
        default.api.timeout.ms: 3000
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never
      table-name: stockrescue.spring_session
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      base-path: /api
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        integration:
          include: kafka,intelligence

stockrescue:
  security:
    secure-cookie: true
    maximum-session-age-seconds: 43200
  intelligence:
    base-url: ${INTELLIGENCE_BASE_URL}

logging:
  structured:
    format:
      console: logstash

springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/v1/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
