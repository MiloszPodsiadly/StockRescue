[project]
name = "stockrescue-intelligence"
version = "0.1.0"
description = "Private technical foundation for StockRescue computation"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[project.scripts]
stockrescue-intelligence = "stockrescue_intelligence.main:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
