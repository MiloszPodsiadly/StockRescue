name: stockrescue

services:
  web:
    image: stockrescue-web:local
    build:
      context: .
      dockerfile: infrastructure/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - edge
      - internal

  backend:
    image: stockrescue-backend:local
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/stockrescue
      DATABASE_USERNAME: stockrescue_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTELLIGENCE_BASE_URL: http://intelligence:8000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    healthcheck:
      test: [CMD, java, -cp, /app/healthcheck, Healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    mem_limit: 512m
    stop_grace_period: 20s
    networks:
      - internal

  intelligence:
    image: stockrescue-intelligence:local
    build:
      context: .
      dockerfile: infrastructure/intelligence/Dockerfile
    environment:
      STOCKRESCUE_INTELLIGENCE_HOST: 0.0.0.0
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=2)']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks:
      - internal

  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - internal

  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: stockrescue
      POSTGRES_USER: stockrescue_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.local}
      STOCKRESCUE_DB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.local}
    volumes:
      - postgres_dev_data:/var/lib/postgresql
      - ./infrastructure/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U stockrescue_admin -d stockrescue']
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_dev_data:
