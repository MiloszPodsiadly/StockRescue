  /api/v1/organizations/{organizationId}/food-safety-profiles/{temperatureClass}/versions:
    get:
      operationId: listFoodSafetyPolicyVersions
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: temperatureClass
        required: true
        schema:
          type: string
          enum:
          - AMBIENT
          - CHILLED
          - FROZEN
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 10000
          minimum: 0
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyPolicyHistoryResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Malformed fields or unsupported policy override
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Action or CSRF denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Scoped resource unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Version, replay or immutable block conflict"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Invalid review evidence
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Read latest review and immutable version history; an absent profile
