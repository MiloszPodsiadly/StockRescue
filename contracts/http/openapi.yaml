          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Invalid input
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: CSRF or action denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Resource or invitation unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Stale version, invalid transition, duplicate invitation or\
            \ last administrator"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Durable per-account invitation rate limit
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Consume the recipient-bound secret once; request manual review without
        activating any authority
      tags:
