      - cancelledByMembershipId
      - id
      - reason
      - revision
      - revisionId
    CatalogProvenanceRequest:
      type: object
      properties:
        reference:
          type: string
          maxLength: 256
          minLength: 0
        source:
          type: string
          maxLength: 256
          minLength: 0
      required:
