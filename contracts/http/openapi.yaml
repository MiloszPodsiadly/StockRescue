openapi: 3.1.0
info:
  title: StockRescue HTTP API
  version: "1"
servers:
- url: /
paths:
  /api/v1/auth/active-organization:
    get:
      operationId: getActiveOrganization
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: Current authorized selection
        "204":
          description: No current authorized selection
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Invalid request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: CSRF invalid or no organization selected
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Organization unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Onboarding already completed or retry payload changed
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request could not be completed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Session storage temporarily unavailable
      security:
      - session: []
      summary: Resolve the session selection through current membership; discard stale
        selectors
      tags:
      - organization-controller
    post:
      operationId: selectOrganization
      parameters:
      - description: Session-bound CSRF value from the CSRF endpoint
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: Validated selection
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Invalid request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: CSRF invalid or no organization selected
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Organization unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Onboarding already completed or retry payload changed
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request could not be completed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Session storage temporarily unavailable
      security:
      - session: []
      summary: Select a currently authorized organization; this selection grants no
        authority
      tags:
      - organization-controller
  /api/v1/auth/csrf:
    get:
      operationId: csrf
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
          description: Session-bound CSRF token
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Invalid request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required or invalid credentials
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: CSRF or access denied
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request too large
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication rate limit
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request could not be completed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Session storage temporarily unavailable
      summary: Obtain a session-bound CSRF token
      tags:
      - auth-controller
  /api/v1/auth/me:
