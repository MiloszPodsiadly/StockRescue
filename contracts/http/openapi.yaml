      summary: Update declared zones or disable a lane at its current version; store
        endpoints stay fixed
      tags:
      - lane-controller
  /api/v1/organizations/{organizationId}/transport-lanes/{laneId}/revisions:
    get:
      operationId: laneCostHistory
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: laneId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 10000
          minimum: 0
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionPageResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Invalid fields, currency or decimal precision"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Org Admin or CSRF required
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Scoped resource unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Stale version, invalid revision order, pending scheduled costs\
            \ or incompatible/inactive configuration"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Immutable price evidence; validity intervals end at the next revision's
        effective time
      tags:
      - lane-controller
    post:
      description: "PostgreSQL wall-clock time is authoritative. The database samples\
        \ it after locking the lane; an omitted effectiveAt uses that sample, and\
        \ an earlier explicit value is rejected."
      operationId: appendLaneCostRevision
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: laneId
        required: true
        schema:
          type: string
          format: uuid
      - description: Session-bound CSRF value from the CSRF endpoint
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostRevisionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaneResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Invalid fields, currency or decimal precision"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Org Admin or CSRF required
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Scoped resource unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Stale version, invalid revision order, pending scheduled costs\
            \ or incompatible/inactive configuration"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Approve an immutable decimal cost/duration version; omitted effectiveAt
        means server approval time
      tags:
      - lane-controller
  /api/v1/organizations/{organizationId}/transport-lanes/{laneId}/scheduled-revisions/cancel:
    post:
      description: "Org Admins may cancel future revisions when a lane is inactive\
        \ or an endpoint store is archived. After locking the lane and candidate revisions,\
        \ PostgreSQL samples wall-clock time; only revisions with effectiveAt strictly\
        \ later than that instant can be cancelled. Cancellation does not reactivate\
        \ the lane or store."
      operationId: cancelScheduledLaneRevisions
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: laneId
        required: true
        schema:
          type: string
          format: uuid
      - description: Session-bound CSRF value from the CSRF endpoint
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelScheduledRevisionsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledRevisionCancellationResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Invalid fields, currency or decimal precision"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Org Admin or CSRF required
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Scoped resource unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Stale version, invalid revision order, pending scheduled costs\
            \ or incompatible/inactive configuration"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Explicitly cancel every future cost revision for a lane and preserve
        its history
      tags:
      - lane-controller
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          pattern: "[A-Za-z0-9_-]{43}"
      required:
      - token
    ApiProblem:
      type: object
      properties:
        code:
          type: string
          enum:
          - ACCESS_DENIED
          - ACCESS_CONFLICT
          - ACCESS_RATE_LIMITED
          - AUTH_RATE_LIMITED
          - AUTH_REQUIRED
          - CSRF_INVALID
          - CONFIGURATION_CONFLICT
          - CONFIGURATION_INACTIVE
          - INCOMPATIBLE_ZONES
          - INTERNAL_ERROR
          - INVALID_CORRELATION_ID
          - INVALID_CREDENTIALS
          - INVALID_REQUEST
          - INVITATION_UNAVAILABLE
          - NO_FUTURE_REVISIONS
          - ONBOARDING_CONFLICT
          - ORGANIZATION_REQUIRED
          - REQUEST_TOO_LARGE
          - RESOURCE_NOT_FOUND
          - SERVICE_UNAVAILABLE
          - SCHEDULED_REVISIONS_PENDING
          - SESSION_EXPIRED
          - STORE_CONFLICT
          - STORE_INACTIVE
          - ZONE_IMPACT_CHANGED
        correlationId:
          type: string
        detail:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
      required:
      - code
      - correlationId
      - detail
      - status
      - title
      - type
    ApprovalRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
        verifiedUserId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - reason
      - verifiedUserId
      - version
    ArchiveStoreRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - reason
      - version
    ArchiveZoneRequest:
      type: object
      properties:
        impactFingerprint:
          type: string
          description: Opaque impact snapshot returned by the scoped preview endpoint.
          minLength: 1
          pattern: "[A-Za-z0-9_-]{43}"
        reason:
          type: string
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - impactFingerprint
      - reason
      - version
    CancelScheduledRevisionsRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        laneVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - expectedRevision
      - laneVersion
      - reason
    CancelledRevisionResponse:
      type: object
      properties:
        cancelledAt:
          type: string
          format: date-time
          description: Database wall-clock instant when cancellation was checked and
            recorded.
        cancelledByMembershipId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        reason:
          type: string
        revision:
          type: integer
          format: int64
        revisionId:
          type: string
          format: uuid
      required:
      - cancelledAt
      - cancelledByMembershipId
      - id
      - reason
      - revision
      - revisionId
    CostRevisionRequest:
      type: object
      properties:
        costAmount:
          type: string
          maxLength: 20
          minLength: 0
          pattern: "(?:0|[1-9][0-9]{0,14})(?:\\.[0-9]{1,4})?"
        currencyCode:
          type: string
          minLength: 1
          pattern: "[A-Z]{3}"
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
        effectiveAt:
          type:
          - string
          - "null"
          format: date-time
          description: Omit to use PostgreSQL wall-clock time sampled after the lane
            is locked.
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        laneVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - costAmount
      - currencyCode
      - durationMinutes
      - expectedRevision
      - laneVersion
      - reason
    CreateLaneRequest:
      type: object
      properties:
        destinationStoreId:
          type: string
          format: uuid
        destinationZoneId:
          type: string
          format: uuid
        originStoreId:
          type: string
          format: uuid
        originZoneId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - destinationStoreId
      - destinationZoneId
      - originStoreId
      - originZoneId
      - reason
    CreateStoreRequest:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 200
          minLength: 0
        city:
          type: string
          maxLength: 100
          minLength: 0
        code:
          type: string
          maxLength: 32
          minLength: 0
        countryCode:
          type: string
          maxLength: 2
          minLength: 0
        name:
          type: string
          maxLength: 160
          minLength: 0
        postalCode:
          type: string
          maxLength: 20
          minLength: 0
        requestId:
          type: string
          format: uuid
        zoneId:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - code
      - name
      - requestId
      - zoneId
    CreateZoneRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        temperatureClass:
          type: string
          enum:
          - AMBIENT
          - CHILLED
          - FROZEN
      required:
      - name
      - temperatureClass
    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
          pattern: "[\\x21-\\x7E]+"
        password:
          type: string
          maxLength: 72
          minLength: 12
      required:
      - email
      - password
    CsrfResponse:
      type: object
      properties:
        headerName:
          type: string
        token:
          type: string
      required:
      - headerName
      - token
    CurrencyOptions:
      type: object
      properties:
        codes:
          type: array
          items:
            type: string
      required:
      - codes
    GrantRequest:
      type: object
      properties:
        grantVersion:
          type: integer
          format: int64
          minimum: 0
        memberVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
        role:
          type: string
          enum:
          - STORE_MANAGER
          - INVENTORY_OPERATOR
          - READ_ONLY_ANALYST
      required:
      - memberVersion
      - reason
      - role
    GrantResponse:
      type: object
      properties:
        role:
          type: string
          enum:
          - STORE_MANAGER
          - INVENTORY_OPERATOR
          - READ_ONLY_ANALYST
        state:
          type: string
        storeId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
      required:
      - role
      - state
      - storeId
      - version
    GrantRevocationRequest:
      type: object
      properties:
        grantVersion:
          type: integer
          format: int64
          minimum: 0
        memberVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - grantVersion
      - memberVersion
      - reason
    InvitationClaimResponse:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        status:
          type: string
      required:
      - membershipId
      - organizationId
      - status
    InvitationIssuedResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        token:
          type: string
      required:
      - expiresAt
      - id
      - token
    InvitationPage:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvitationResponse"
      required:
      - hasMore
      - items
    InvitationResponse:
      type: object
      properties:
        email:
          type: string
        expiresAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        status:
          type: string
        version:
          type: integer
          format: int64
      required:
      - email
      - expiresAt
      - id
      - status
      - version
    InviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
          pattern: "[!-~]+"
        reason:
          type: string
          maxLength: 500
          minLength: 0
        storeGrants:
          type: array
          items:
            $ref: "#/components/schemas/PlannedGrantRequest"
          maxItems: 50
          minItems: 0
      required:
      - email
      - reason
      - storeGrants
    LaneLookupResponse:
      type: object
      properties:
        asOf:
          type: string
          format: date-time
          description: Database wall-clock instant used to resolve current cost.
        lane:
          anyOf:
          - $ref: "#/components/schemas/LaneResponse"
          - type: "null"
        missing:
          type: array
          items:
            type: string
            enum:
            - NO_LANE
            - INACTIVE_LANE
            - INACTIVE_STORE
            - MISSING_ZONES
            - INACTIVE_ZONE
            - INCOMPATIBLE_ZONES
            - NO_EFFECTIVE_COST
            - COST_ZONE_MISMATCH
        status:
          type: string
          enum:
          - CONFIGURED
          - UNCONFIGURED
          - INACTIVE
      required:
      - asOf
      - lane
      - missing
      - status
    LanePageResponse:
      type: object
      properties:
        asOf:
          type: string
          format: date-time
          description: Database wall-clock instant used to resolve current costs.
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/LaneResponse"
      required:
      - asOf
      - hasMore
      - items
    LaneResponse:
      type: object
      properties:
        active:
          type: boolean
        asOf:
          type: string
          format: date-time
          description: Database wall-clock instant used to resolve current cost.
        currentCost:
          anyOf:
          - $ref: "#/components/schemas/RevisionResponse"
          - type: "null"
        destinationStoreId:
          type: string
          format: uuid
        destinationStoreName:
          type: string
        destinationZoneId:
          type:
          - string
          - "null"
          format: uuid
        id:
          type: string
          format: uuid
        latestEffectiveAt:
          type:
          - string
          - "null"
          format: date-time
        latestRevision:
          type: integer
          format: int64
        missing:
          type: array
          items:
            type: string
            enum:
            - NO_LANE
            - INACTIVE_LANE
            - INACTIVE_STORE
            - MISSING_ZONES
            - INACTIVE_ZONE
            - INCOMPATIBLE_ZONES
            - NO_EFFECTIVE_COST
            - COST_ZONE_MISMATCH
        originStoreId:
          type: string
          format: uuid
        originStoreName:
          type: string
        originZoneId:
          type:
          - string
          - "null"
          format: uuid
        status:
          type: string
          enum:
          - CONFIGURED
          - UNCONFIGURED
          - INACTIVE
        version:
          type: integer
          format: int64
      required:
      - active
      - asOf
      - currentCost
      - destinationStoreId
      - destinationStoreName
      - destinationZoneId
      - id
      - latestEffectiveAt
      - latestRevision
      - missing
      - originStoreId
      - originStoreName
      - originZoneId
      - status
      - version
    MemberPage:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberResponse"
      required:
      - hasMore
      - items
    MemberResponse:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - APPROVE
            - CHANGE_ROLE
            - REVOKE
            - SET_GRANT
            - REVOKE_GRANT
        email:
          type: string
        grants:
          type: array
          items:
            $ref: "#/components/schemas/GrantResponse"
        id:
          type: string
          format: uuid
        plannedGrants:
          type: array
          items:
            $ref: "#/components/schemas/PlannedGrantResponse"
        role:
          type: string
          enum:
          - ORG_ADMIN
          - MEMBER
        state:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - REVOKED
        userId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
      required:
      - allowedActions
      - email
      - grants
      - id
      - plannedGrants
      - role
      - state
      - userId
      - version
    OnboardingRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 0
        requestId:
          type: string
          format: uuid
      required:
      - name
      - requestId
    OrganizationListResponse:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationResponse"
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
      required:
      - hasMore
      - items
      - limit
      - offset
    OrganizationResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
          - ORG_ADMIN
          - MEMBER
      required:
      - createdAt
      - id
      - membershipId
      - name
      - role
    PermissionsResponse:
      type: object
      properties:
        allStoreActions:
          type: array
          items:
            type: string
            enum:
            - READ_STORE
            - EDIT_STORE
            - ARCHIVE_STORE
            - MANAGE_STORAGE_ZONES
        organization:
          $ref: "#/components/schemas/OrganizationResponse"
        organizationActions:
          type: array
          items:
            type: string
            enum:
            - READ_ORGANIZATION
            - MANAGE_ACCESS
            - CREATE_STORE
            - MANAGE_TRANSPORT_LANES
        storeGrants:
          type: array
          items:
            $ref: "#/components/schemas/StorePermissionResponse"
      required:
      - allStoreActions
      - organization
      - organizationActions
      - storeGrants
    PlannedGrantRequest:
      type: object
      properties:
        role:
          type: string
          enum:
          - STORE_MANAGER
          - INVENTORY_OPERATOR
          - READ_ONLY_ANALYST
        storeId:
          type: string
          format: uuid
      required:
      - role
      - storeId
    PlannedGrantResponse:
      type: object
      properties:
        role:
          type: string
          enum:
          - STORE_MANAGER
          - INVENTORY_OPERATOR
          - READ_ONLY_ANALYST
        storeId:
          type: string
          format: uuid
      required:
      - role
      - storeId
    RegistrationResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    RenameZoneRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - name
      - reason
      - version
    RevisionPageResponse:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/RevisionResponse"
      required:
      - hasMore
      - items
    RevisionResponse:
      type: object
      properties:
        cancellation:
          anyOf:
          - $ref: "#/components/schemas/CancelledRevisionResponse"
          - type: "null"
        costAmount:
          type: string
        currencyCode:
          type: string
        destinationZoneId:
          type:
          - string
          - "null"
          format: uuid
        durationMinutes:
          type: integer
          format: int32
        effectiveAt:
          type: string
          format: date-time
          description: Database wall-clock instant when this revision becomes effective.
        id:
          type: string
          format: uuid
        originZoneId:
          type:
          - string
          - "null"
          format: uuid
        recordedAt:
          type: string
          format: date-time
          description: Database wall-clock instant sampled for approval after the
            lane lock.
        recordedByMembershipId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        temperatureClass:
          type:
          - string
          - "null"
          enum:
          - AMBIENT
          - CHILLED
          - FROZEN
          - null
        validUntil:
          type:
          - string
          - "null"
