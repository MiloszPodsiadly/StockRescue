      tags:
      - food-safety-controller
    post:
      operationId: recordFoodSafetyPolicyReview
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: temperatureClass
        required: true
        schema:
          type: string
          enum:
          - AMBIENT
          - CHILLED
          - FROZEN
      - description: Session-bound CSRF value from the CSRF endpoint
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordFoodSafetyPolicyReviewRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyPolicyVersionResponse"
          description: Previously recorded immutable version
