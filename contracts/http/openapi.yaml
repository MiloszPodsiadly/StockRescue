          description: "Invalid fields, currency or decimal precision"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Org Admin or CSRF required
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Scoped resource unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Stale version, invalid revision order, pending scheduled costs\
            \ or incompatible/inactive configuration"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Approve an immutable decimal cost/duration version; omitted effectiveAt
        means server approval time
      tags:
      - lane-controller
  /api/v1/organizations/{organizationId}/transport-lanes/{laneId}/scheduled-revisions/cancel:
    post:
      description: "Org Admins may cancel future revisions when a lane is inactive\
        \ or an endpoint store is archived. After locking the lane and candidate revisions,\
        \ PostgreSQL samples wall-clock time; only revisions with effectiveAt strictly\
        \ later than that instant can be cancelled. Cancellation does not reactivate\
        \ the lane or store."
      operationId: cancelScheduledLaneRevisions
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: laneId
        required: true
        schema:
          type: string
          format: uuid
      - description: Session-bound CSRF value from the CSRF endpoint
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelScheduledRevisionsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledRevisionCancellationResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Invalid fields, currency or decimal precision"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Org Admin or CSRF required
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Scoped resource unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Stale version, invalid revision order, pending scheduled costs\
            \ or incompatible/inactive configuration"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Explicitly cancel every future cost revision for a lane and preserve
        its history
      tags:
      - lane-controller
  /api/v1/organizations/{organizationId}/transport-lanes/{laneId}/scheduled-revisions/cancellation-resolution:
    post:
      description: "Uses the same organization, store and lane lock order as cancellation.\
        \ PostgreSQL wall-clock time is sampled after the lane lock, and reviewed\
        \ revision evidence is read at READ COMMITTED after any lock wait."
      operationId: resolveScheduledLaneCancellation
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: laneId
        required: true
        schema:
          type: string
          format: uuid
      - description: Session-bound CSRF value from the CSRF endpoint
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledRevisionCancellationResolutionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledRevisionCancellationResolutionResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Invalid fields, currency or decimal precision"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Org Admin or CSRF required
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Scoped resource unavailable
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: "Stale version, invalid revision order, pending scheduled costs\
            \ or incompatible/inactive configuration"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Request failed
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
          description: Service unavailable
      security:
      - session: []
      summary: Resolve an uncertain scheduled-cost cancellation after synchronizing
        with lane writes
      tags:
      - lane-controller
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          pattern: "[A-Za-z0-9_-]{43}"
      required:
      - token
    ApiProblem:
      type: object
      properties:
        code:
          type: string
          enum:
          - ACCESS_DENIED
          - ACCESS_CONFLICT
          - ACCESS_RATE_LIMITED
          - AUTH_RATE_LIMITED
          - AUTH_REQUIRED
          - CSRF_INVALID
          - CATALOG_CONFLICT
          - CATALOG_INACTIVE
          - CONFIGURATION_CONFLICT
          - CONFIGURATION_INACTIVE
          - INCOMPATIBLE_ZONES
          - INTERNAL_ERROR
          - INVALID_CORRELATION_ID
          - INVALID_CREDENTIALS
          - INVALID_REQUEST
          - INVITATION_UNAVAILABLE
          - NO_FUTURE_REVISIONS
          - ONBOARDING_CONFLICT
          - ORGANIZATION_REQUIRED
          - REQUEST_TOO_LARGE
          - RESOURCE_NOT_FOUND
          - SERVICE_UNAVAILABLE
          - SCHEDULED_REVISIONS_PENDING
          - SESSION_EXPIRED
          - STORE_CONFLICT
          - STORE_INACTIVE
          - ZONE_IMPACT_CHANGED
          - ZONE_HAS_ACTIVE_LOCATIONS
        correlationId:
          type: string
        detail:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
      required:
      - code
      - correlationId
      - detail
      - status
      - title
      - type
    ApprovalRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
        verifiedUserId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - reason
      - verifiedUserId
      - version
    ArchiveProductRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
        requestId:
          type: string
          format: uuid
      required:
      - expectedVersion
      - reason
      - requestId
    ArchiveStorageLocationRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          format: int64
          maximum: 9223372036854775806
          minimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
        requestId:
          type: string
          format: uuid
      required:
      - expectedVersion
      - reason
      - requestId
    ArchiveStoreRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - reason
      - version
    ArchiveZoneRequest:
      type: object
      properties:
        impactFingerprint:
          type: string
          description: Opaque impact snapshot returned by the scoped preview endpoint.
          minLength: 1
          pattern: "[A-Za-z0-9_-]{43}"
        reason:
          type: string
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - impactFingerprint
      - reason
      - version
    CancelScheduledRevisionsRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        laneVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - expectedRevision
      - laneVersion
      - reason
    CancelledRevisionResponse:
      type: object
      properties:
        cancelledAt:
          type: string
          format: date-time
          description: Database wall-clock instant when cancellation was checked and
            recorded.
        cancelledByMembershipId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        reason:
          type: string
        revision:
          type: integer
          format: int64
