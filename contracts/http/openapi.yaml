          - string
          - "null"
        normalizedCutoff:
          type:
          - string
          - "null"
          format: date
        precision:
          type: string
          enum:
          - DAY
          - MONTH
          - YEAR
          - UNKNOWN
        provenance:
          anyOf:
          - $ref: "#/components/schemas/CatalogProvenanceResponse"
          - type: "null"
        type:
          type: string
          enum:
          - USE_BY
          - BEST_BEFORE
          - BEST_BEFORE_END
          - UNKNOWN
        validationReasons:
          type: array
          items:
            type: string
            enum:
            - MISSING_LABEL
            - UNKNOWN_TYPE
            - UNKNOWN_PRECISION
            - MISSING_PROVENANCE
            - USE_BY_REQUIRES_DAY
            - UNRECOGNIZED_FORMAT
            - NONEXISTENT_DATE
        validationStatus:
          type: string
          enum:
          - VALID
          - INCOMPLETE
          - INVALID
      required:
      - labeledValue
      - normalizedCutoff
      - precision
      - provenance
      - type
      - validationReasons
      - validationStatus
